<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fff; padding: 20px 24px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 8px; }
  .specimen { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--color-neutral-100); padding-bottom: 6px; }
  .specimen:last-child { border-bottom: none; }
  .meta { min-width: 120px; font-size: 9px; font-family: var(--font-mono); color: var(--color-fg-subtle); line-height: 1.5; }
  .text { color: var(--color-fg); }
  .pill { display: inline-block; font-size: 8px; font-family: var(--font-mono); font-weight: 600; padding: 1px 5px; border-radius: 3px; vertical-align: middle; margin-left: 6px; }
</style></head><body>

<div class="specimen">
  <div class="meta">Display LG<br><strong>Syne 800</strong><br>72px / –3%</div>
  <div class="text" style="font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,4rem);letter-spacing:-0.03em;line-height:1.08">
    Tvenning<span class="pill" style="background:var(--color-brand-50);color:#3366cc">Syne 800</span>
  </div>
</div>

<div class="specimen">
  <div class="meta">Display SM<br><strong>Syne 800</strong><br>48px / –1%</div>
  <div class="text" style="font-family:'Syne',sans-serif;font-weight:800;font-size:2.5rem;letter-spacing:-0.02em;line-height:1.1">Built to last.</div>
</div>

<div class="specimen">
  <div class="meta">H1<br><strong>Space Grotesk 700</strong><br>36px / –1%</div>
  <div class="text" style="font: var(--type-h1); letter-spacing: var(--tracking-snug)">
    About the project<span class="pill" style="background:#f0f4ff;color:#3366cc">Space Grotesk</span>
  </div>
</div>

<div class="specimen">
  <div class="meta">H2<br><strong>Space Grotesk 600</strong><br>30px</div>
  <div class="text" style="font: var(--type-h2)">Services offered</div>
</div>

<div class="specimen">
  <div class="meta">H3<br><strong>Space Grotesk 600</strong><br>24px</div>
  <div class="text" style="font: var(--type-h3)">Web development</div>
</div>

<div class="specimen">
  <div class="meta">H4<br><strong>DM Sans 500</strong><br>20px</div>
  <div class="text" style="font: var(--type-h4)">Project timeline</div>
</div>

</body></html>
