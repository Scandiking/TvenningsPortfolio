<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--color-neutral-50); padding: 16px; font-family: var(--font-body); }
  .row { display: flex; gap: 4px; }
  .swatch { flex: 1; height: 64px; border-radius: 4px; display: flex; align-items: flex-end; padding: 5px; border: 1px solid rgba(0,0,0,.06); }
  .label { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
  .meta { display: flex; justify-content: space-between; padding: 4px 0 0; }
  .step { flex: 1; text-align: center; font-size: 9px; color: var(--color-fg-muted); font-family: var(--font-mono); }
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#fff"><span class="label" style="color:#a4aec6">0</span></div>
  <div class="swatch" style="background:var(--color-neutral-50)"><span class="label" style="color:#a4aec6">50</span></div>
  <div class="swatch" style="background:var(--color-neutral-100)"><span class="label" style="color:#7a8baa">100</span></div>
  <div class="swatch" style="background:var(--color-neutral-200)"><span class="label" style="color:#56688a">200</span></div>
  <div class="swatch" style="background:var(--color-neutral-300)"><span class="label" style="color:#fff">300</span></div>
  <div class="swatch" style="background:var(--color-neutral-400)"><span class="label" style="color:#fff">400</span></div>
  <div class="swatch" style="background:var(--color-neutral-500)"><span class="label" style="color:#e6eaf5">500</span></div>
  <div class="swatch" style="background:var(--color-neutral-600)"><span class="label" style="color:#c8cfdf">600</span></div>
  <div class="swatch" style="background:var(--color-neutral-700)"><span class="label" style="color:#a4aec6">700</span></div>
  <div class="swatch" style="background:var(--color-neutral-800)"><span class="label" style="color:#7a8baa">800</span></div>
  <div class="swatch" style="background:var(--color-neutral-900)"><span class="label" style="color:#56688a">900</span></div>
</div>
<div class="meta">
  <span class="step">#ffffff</span>
  <span class="step">#f4f6fc</span>
  <span class="step">#e6eaf5</span>
  <span class="step">#c8cfdf</span>
  <span class="step">#a4aec6</span>
  <span class="step">#7a8baa</span>
  <span class="step">#56688a</span>
  <span class="step">#3d4f6e</span>
  <span class="step">#283655</span>
  <span class="step">#18243d</span>
  <span class="step">#0d1526</span>
</div>
</body></html>
