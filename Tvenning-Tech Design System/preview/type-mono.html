<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--color-neutral-50); padding: 20px 24px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 10px; }
  .block { background: var(--color-neutral-900); border-radius: var(--radius-md); padding: 14px 16px; }
  .code { font: var(--type-code); color: #88aaee; }
  .comment { color: var(--color-neutral-500); }
  .string { color: #88ddaa; }
  .key { color: #aad4ff; }
  .meta { font-size: 10px; font-family: var(--font-mono); color: var(--color-fg-muted); margin-bottom: 4px; }
</style></head><body>
<div class="meta">JetBrains Mono — code specimens</div>
<div class="block">
  <div class="code"><span class="comment">// Tvenning-Tech · colors_and_type.css</span></div>
  <div class="code"><span class="key">--color-primary</span>: <span class="string">#3366cc</span>;</div>
  <div class="code"><span class="key">--font-display</span>: <span class="string">'Syne'</span>, sans-serif;</div>
  <div class="code"><span class="key">--radius-md</span>: <span class="string">6px</span>;</div>
</div>
<div class="block" style="background: var(--color-brand-900)">
  <div class="code" style="font: var(--type-code-sm)"><span class="comment">/* 12px · labels, inline code */</span></div>
  <div class="code" style="font: var(--type-code-sm); color: #c8d8ff">npm install &amp;&amp; npm run dev</div>
</div>
</body></html>
