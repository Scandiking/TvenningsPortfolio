<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--color-neutral-50); padding: 16px; font-family: var(--font-body); }
  .row { display: flex; gap: 4px; }
  .swatch { flex: 1; height: 64px; border-radius: 4px; display: flex; align-items: flex-end; padding: 5px; }
  .label { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }
  .meta { display: flex; justify-content: space-between; padding: 4px 0 0; }
  .step { flex: 1; text-align: center; font-size: 9px; color: var(--color-fg-muted); font-family: var(--font-mono); }
</style></head><body>
<div class="row">
  <div class="swatch" style="background:var(--color-brand-50)"><span class="label" style="color:#3366cc">50</span></div>
  <div class="swatch" style="background:var(--color-brand-100)"><span class="label" style="color:#3366cc">100</span></div>
  <div class="swatch" style="background:var(--color-brand-200)"><span class="label" style="color:#3366cc">200</span></div>
  <div class="swatch" style="background:var(--color-brand-300)"><span class="label" style="color:white">300</span></div>
  <div class="swatch" style="background:var(--color-brand-400)"><span class="label" style="color:white">400</span></div>
  <div class="swatch" style="background:var(--color-brand-500); outline: 3px solid #0d1526; outline-offset: -3px; border-radius:4px"><span class="label" style="color:white">500 ★</span></div>
  <div class="swatch" style="background:var(--color-brand-600)"><span class="label" style="color:white">600</span></div>
  <div class="swatch" style="background:var(--color-brand-700)"><span class="label" style="color:white">700</span></div>
  <div class="swatch" style="background:var(--color-brand-800)"><span class="label" style="color:#6699e6">800</span></div>
  <div class="swatch" style="background:var(--color-brand-900)"><span class="label" style="color:#6699e6">900</span></div>
</div>
<div class="meta">
  <span class="step">#eaf0fb</span>
  <span class="step">#c7d8f5</span>
  <span class="step">#99b8ed</span>
  <span class="step">#6699e6</span>
  <span class="step">#4480db</span>
  <span class="step" style="font-weight:700;color:#3366cc">#3366cc</span>
  <span class="step">#2554b8</span>
  <span class="step">#1a4399</span>
  <span class="step">#112f77</span>
  <span class="step">#0a1e4f</span>
</div>
</body></html>
