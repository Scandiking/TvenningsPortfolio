<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--color-neutral-50); padding: 20px 24px; font-family: var(--font-body); display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-row { display: flex; gap: 12px; }
  label { font: var(--type-label-sm); color: var(--color-fg-muted); letter-spacing: .02em; }
  input, textarea, select {
    font: var(--type-body-sm); color: var(--color-fg);
    background: #fff; border: 1.5px solid var(--color-border);
    border-radius: var(--radius-md); padding: 9px 12px;
    width: 100%; outline: none; transition: border-color var(--transition-base), box-shadow var(--transition-base);
    appearance: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(51,102,204,.15);
  }
  input.error { border-color: #cc3344; }
  input.error:focus { box-shadow: 0 0 0 3px rgba(204,51,68,.15); }
  input:disabled { background: var(--color-bg-muted); color: var(--color-fg-subtle); cursor: not-allowed; }
  .hint { font: var(--type-caption); color: var(--color-fg-subtle); }
  .error-msg { font: var(--type-caption); color: #cc3344; }
</style></head><body>
<div class="field-row">
  <div class="field" style="flex:1">
    <label>Name</label>
    <input type="text" placeholder="Your name" value="">
  </div>
  <div class="field" style="flex:1">
    <label>Email</label>
    <input type="email" placeholder="you@example.com" value="hello@example.com">
  </div>
</div>
<div class="field">
  <label>Subject</label>
  <input type="text" class="error" value="Website redesign">
  <span class="error-msg">This field is required.</span>
</div>
<div class="field">
  <label>Message</label>
  <textarea rows="3" placeholder="Describe your project..."></textarea>
  <span class="hint">Be as brief or detailed as you like.</span>
</div>
<div class="field-row">
  <div class="field" style="flex:1">
    <label>Service</label>
    <select><option>Web development</option><option>App development</option><option>Consultation</option></select>
  </div>
  <div class="field" style="flex:1">
    <label>Disabled</label>
    <input type="text" disabled value="Not editable">
  </div>
</div>
</body></html>
